name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # The build only needs these to exist; sst deploy sets the real values.
          VITE_GRAPHQL_URL: https://example.invalid/graphql
          VITE_GRAPHQL_API_KEY: ci
